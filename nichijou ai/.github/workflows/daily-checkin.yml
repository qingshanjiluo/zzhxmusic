name: Daily Checkin

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 \
            libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
            fonts-liberation

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-checkin/requirements.txt
          playwright install chromium

      - name: Run checkin
        working-directory: daily-checkin
        env:
          GITHUB_ACTIONS: 'true'
        run: python checkin.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-results-${{ github.run_number }}
          path: |
            daily-checkin/checkin_results.json
            daily-checkin/checkin_log.txt
          retention-days: 30
